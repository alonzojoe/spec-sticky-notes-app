<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- P8. The Vite-era mark that survived P0's clear-the-deck was cold purple and blue, which
       mission.md rules out by name: "warm neutrals… no cold grays". This is the app's own
       palette — cork behind, butter paper in front, ink for the writing. -->
  <title>Sticky</title>
  <rect width="32" height="32" rx="7" fill="#aa805c"/>
  <!-- One sheet of paper, square in its cell the way the grid puts it since P5, with the layered
       contact shadow the board's cards carry. Legible at 16px because it is two shapes. -->
  <rect x="6.5" y="7.5" width="19" height="18" rx="2.5" fill="#906749" opacity="0.55"/>
  <rect x="6" y="6.5" width="19" height="18" rx="2.5" fill="#f6ecc3"/>
  <!-- Three ruled lines, the shortest last: a note with something written on it. -->
  <g fill="#342a22" opacity="0.62">
    <rect x="9" y="11" width="13" height="1.8" rx="0.9"/>
    <rect x="9" y="14.7" width="13" height="1.8" rx="0.9"/>
    <rect x="9" y="18.4" width="8" height="1.8" rx="0.9"/>
  </g>
</svg>
